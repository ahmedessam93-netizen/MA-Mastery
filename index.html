<!doctype html><html lang="en"><head><meta charset="utf-8"><title>MA Mastery</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0C6A80">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="MA Mastery">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="icon" href="icons/icon-192.png">
<style>
#lock{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#0E161F;color:#E8EEF5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
#lock img{width:96px;height:96px;border-radius:22px}
#lock h1{font-size:1.5rem;margin:0}#lock p{margin:0;color:#9AAABB;font-size:.95rem;max-width:30ch}
#lock input{font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:12px;border:1.5px solid #2A3847;background:#17222E;color:inherit;width:min(100%,300px);text-align:center}
#lock button{font:inherit;font-weight:600;padding:12px 28px;border-radius:999px;border:0;background:#57BDD2;color:#06222A;min-height:46px}
#lock .err{color:#F0705B;min-height:1.3em}
</style></head><body>
<div id="lock"><img src="icons/icon-192.png" alt=""><h1>MA Mastery</h1><p id="lm">Private. Enter the passcode once and this device will remember it.</p>
<form id="lf"><input id="lp" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Passcode" placeholder="Passcode"><div class="err" id="le" role="alert"></div><button>Open</button></form></div>
<div id="root"></div>
<script>
(function(){
  var K="ma-mastery-key", lock=document.getElementById("lock"), le=document.getElementById("le"), lm=document.getElementById("lm"), buf=null;
  function b64(a){ var s=""; new Uint8Array(a).forEach(function(c){ s+=String.fromCharCode(c); }); return btoa(s); }
  function unb(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
  function data(){ return buf ? Promise.resolve(buf) : fetch("app.bin").then(function(r){ if(!r.ok) throw new Error("net"); return r.arrayBuffer(); }).then(function(b){ buf=b; return b; }); }
  function open(raw){
    return data().then(function(b){ var u=new Uint8Array(b);
      return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]).then(function(k){ return crypto.subtle.decrypt({name:"AES-GCM", iv:u.slice(16,28)}, k, u.slice(28)); });
    }).then(function(pt){ var o=JSON.parse(new TextDecoder().decode(pt));
      document.getElementById("root").innerHTML=o.html; lock.remove();
      var s=document.createElement("script"); s.textContent=o.js; document.body.appendChild(s);
    });
  }
  function derive(pass){ return data().then(function(b){ var salt=new Uint8Array(b).slice(0,16);
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]).then(function(k){ return crypto.subtle.deriveBits({name:"PBKDF2", salt:salt, iterations:310000, hash:"SHA-256"}, k, 256); }); }); }
  document.getElementById("lf").onsubmit=function(e){ e.preventDefault(); var p=document.getElementById("lp").value.trim(); if(!p) return; le.textContent=""; lm.textContent="Opening.";
    derive(p).then(function(raw){ return open(raw).then(function(){ try{ localStorage.setItem(K, b64(raw)); }catch(x){} }); }).catch(function(x){ lm.textContent="Private. Enter the passcode once and this device will remember it."; le.textContent = x && x.message==="net" ? "No connection. Try again when you are online." : "That passcode did not open it."; });
  };
  var saved=null; try{ saved=localStorage.getItem(K); }catch(x){}
  if(saved){ lm.textContent="Opening."; open(unb(saved)).catch(function(){ try{ localStorage.removeItem(K); }catch(x){} lm.textContent="Private. Enter the passcode once and this device will remember it."; }); }
  if("serviceWorker" in navigator){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
})();
</script></body></html>
